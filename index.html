<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Global Supply Control Tower | JS KIM (v9.8)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="data/data_sm.js"></script>
    <script src="data/data_an.js"></script>
    <script src="data/data_bd.js"></script>
    <style>
        :root { --primary: #0A2647; --accent: #1597BB; --current: #1A1A1B; --future: #D35400; --bg: #F0F5F9; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        #layout { display: flex; height: 100vh; width: 100vw; position: relative; }
        #map { flex-grow: 1; height: 100%; background: #DAEAF1; z-index: 1; }
        .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-popup { -webkit-backface-visibility: hidden; backface-visibility: hidden; will-change: transform; transition: none !important; }
        #sidebar { position: absolute; left: 0; top: 0; width: 360px; height: 100%; background: white; z-index: 2000; transition: transform 0.4s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        #sidebar.hidden { transform: translateX(-100%); }
        #toggle-btn { position: absolute; right: -45px; top: 20px; width: 45px; height: 45px; background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 0 8px 8px 0; font-size: 18px; z-index: 2001; }
        .header { background: var(--primary); color: white; padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); position: relative; }
        .created-by { font-size: 1.3rem; color: #FFD700; font-weight: 900; display: block; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 15px; border-bottom: 1px solid rgba(255,215,0,0.3); padding-bottom: 5px; }
        #data-mode { position: absolute; right: 20px; bottom: 20px; font-size: 0.65rem; font-weight: 900; padding: 4px 10px; border-radius: 12px; background: #95a5a6; color: white; cursor: pointer; z-index: 2002; }
        .product-tabs { display: flex; background: #051937; padding: 5px; gap: 4px; }
        .tab-btn { flex: 1; padding: 12px 2px; border: none; background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-weight: bold; font-size: 0.75rem; border-radius: 4px; }
        .tab-btn.active { background: var(--accent); color: white; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; background: var(--accent); color: white; gap: 1px; }
        .metric-box { padding: 12px; background: var(--accent); text-align: center; }
        .metric-value { font-size: 1.25rem; font-weight: 900; }
        #list-container { flex-grow: 1; overflow-y: auto; background: var(--bg); }
        .group-header { padding: 14px 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.85rem; align-items: center; }
        .region-header { background: #cbdceb; color: var(--primary); margin-top: 2px; }
        .country-header { background: #e8eff5; font-size: 0.78rem; padding-left: 20px; border-left: 3px solid var(--accent); }
        .header-stats { font-weight: 900; display: block; margin-top: 4px; font-size: 0.85rem; }
        .collapsible-content { display: none; }
        .open > .collapsible-content { display: block; }
        .plant-card { padding: 12px 15px 12px 30px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.72rem; background: white; position: relative; }
        .loss-badge { background: #E74C3C; color: white; font-weight: bold; padding: 2px 6px; border-radius: 10px; font-size: 0.6rem; position: absolute; right: 10px; top: 10px; }
        #update-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; background: white; z-index: 11000; padding: 25px; box-shadow: 0 0 60px rgba(0,0,0,0.6); border-radius: 20px; display: none; }
        #update-modal textarea { width: 100%; height: 180px; margin: 10px 0; font-size: 0.75rem; border: 1px solid #ddd; border-radius: 5px; padding: 8px; box-sizing: border-box; }
        #admin-password { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid var(--primary); border-radius: 8px; box-sizing: border-box; font-weight: bold; font-size: 1rem; text-align: center; }
        #data-input-section { display: none; border-top: 2px dashed #eee; padding-top: 15px; margin-top: 10px; }
        #sync-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 38, 71, 0.97); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; transition: opacity 0.4s ease; }
        .sync-spinner { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #FFD700; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-triangle svg { filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2)); display: block; }
    </style>
</head>
<body>

<div id="update-modal">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin:0; color:var(--primary);">🔒 JS KIM Auth</h3>
        <span style="font-size: 0.7rem; color: #999;">ADMIN CONTROL</span>
    </div>
    <div id="auth-section">
        <label style="font-size:0.85rem; font-weight:bold; display:block; margin-bottom:8px;">관리자 암호를 입력하십시오</label>
        <input type="password" id="admin-password" placeholder="Enter Admin Password">
        <button style="background:var(--primary); color:white; padding:12px; width:100%; border:none; border-radius:8px; cursor:pointer; font-weight:900;" onclick="verifyAdmin()">보안 인증 확인</button>
    </div>
    <div id="data-input-section">
        <textarea id="csv-input" placeholder="엑셀 또는 시트에서 복사한 데이터를 붙여넣으세요..."></textarea>
        <div style="display: flex; gap: 10px;">
            <button style="flex: 2; background:#27ae60; color:white; padding:15px; border:none; border-radius:10px; cursor:pointer; font-weight:900;" onclick="saveManualData()">저장</button>
            <button style="flex: 1; background:#e67e22; color:white; padding:15px; border:none; border-radius:10px; cursor:pointer; font-weight:900;" onclick="clearManualData()">초기화</button>
        </div>
    </div>
    <button style="width:100%; margin-top:15px; border:none; padding:10px; border-radius:8px; cursor:pointer; background:#f5f5f5; color:#666;" onclick="closeModal()">닫기</button>
</div>

<div id="sync-overlay">
    <div id="sync-icon" class="sync-spinner"></div>
    <div id="sync-main-text" style="font-size: 1.8rem; font-weight: 900; margin-bottom: 12px;">동기화 시도 중...</div>
    <div id="sync-sub-text" style="font-size: 1.1rem; color: #1597BB; font-weight: 500;">Attempting Online Sync...</div>
    <div style="margin-top: 60px; color: #FFD700; font-weight: 900; font-size: 1.5rem;">CREATED BY JS KIM OF LAM</div>
</div>

<div id="layout">
    <div id="sidebar">
        <button id="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('hidden')">☰</button>
        <div class="product-tabs">
            <button class="tab-btn active" id="btn-SM" onclick="switchProduct('SM')">SM</button>
            <button class="tab-btn" id="btn-AN" onclick="switchProduct('AN')">AN</button>
            <button class="tab-btn" id="btn-BD" onclick="switchProduct('BD')">BD</button>
        </div>
        <div class="header">
            <span class="created-by">CREATED BY JS KIM OF LAM</span>
            <h1 id="prod-title" onclick="resetToGlobal()" style="margin:0; font-size:1.1rem; cursor:pointer; opacity:0.9;">Global Supply Control Map</h1>
            <span id="data-mode" onclick="showUpdateModal()">SYNC CHECK</span>
        </div>
        <div class="metrics-grid">
            <div class="metric-box"><span style="font-size:0.6rem; opacity:0.8; display:block;">GLOBAL CAPA</span><span class="metric-value" id="global-val">0</span></div>
            <div class="metric-box"><span style="font-size:0.6rem; opacity:0.8; display:block;">TOTAL SITES</span><span class="metric-value" id="total-sites">0</span></div>
            <div class="metric-box" style="background: #1A1A1B;"><span style="font-size:0.6rem; opacity:0.8; display:block;">CUR. LOSS %</span><span class="metric-value" id="cur-ratio" style="color:#FF4D4D">0.00%</span></div>
            <div class="metric-box" style="background: #D35400;"><span style="font-size:0.6rem; opacity:0.8; display:block;">FUT. LOSS %</span><span class="metric-value" id="fut-ratio" style="color:#FFD700">0.00%</span></div>
        </div>
        <div id="list-container">
            <div id="current-risk-group" class="open"><div class="group-header" style="background:var(--current); color:white" onclick="this.parentElement.classList.toggle('open')"><span>⚠️ CURRENT RISK</span><span id="cur-sum-h" style="font-size:0.75rem;"></span></div><div class="collapsible-content" id="current-risk-list"></div></div>
            <div id="future-risk-group" class="open"><div class="group-header" style="background:var(--future); color:white" onclick="this.parentElement.classList.toggle('open')"><span>📅 FUTURE MAINT</span><span id="fut-sum-h" style="font-size:0.75rem;"></span></div><div class="collapsible-content" id="future-risk-list"></div></div>
            <div style="background: var(--primary); color:white; padding:10px 12px; font-size:0.75rem; font-weight:bold; margin-top:10px;">🌐 REGIONAL DIRECTORY</div>
            <div id="region-list"></div>
        </div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const ADMIN_PASS = "jskim0111"; //
    const SHEET_URLS = { 'SM': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=0&single=true&output=csv', 'AN': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=263516767&single=true&output=csv', 'BD': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=607848019&single=true&output=csv' };
    let currentProd = 'SM';
    const map = L.map('map', {zoomControl: false, zoomAnimation: true, markerZoomAnimation: false}).setView([20, 100], 3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
    let activeMarkers = [];

    function showUpdateModal() { document.getElementById('admin-password').value = ""; document.getElementById('auth-section').style.display = 'block'; document.getElementById('data-input-section').style.display = 'none'; document.getElementById('update-modal').style.display = 'block'; }
    function closeModal() { document.getElementById('update-modal').style.display = 'none'; }
    function verifyAdmin() { if (document.getElementById('admin-password').value === ADMIN_PASS) { document.getElementById('auth-section').style.display = 'none'; document.getElementById('data-input-section').style.display = 'block'; } else { alert("❌ 보안 경고: 암호 불일치."); } }
    function saveManualData() { const input = document.getElementById('csv-input').value; const parsed = parseUniversal(input); if(parsed.length > 0) { localStorage.setItem(`MANUAL_DATA_${currentProd}`, JSON.stringify(parsed)); alert(`✅ ${currentProd} 저장 완료.`); closeModal(); renderEverything(parsed, currentProd); } else { alert("데이터 형식을 확인하세요."); } }
    function clearManualData() { if(confirm("메모리를 초기화하시겠습니까?")) { localStorage.removeItem(`MANUAL_DATA_${currentProd}`); location.reload(); } }

    function parseUniversal(text) {
        const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
        if(lines.length < 2) return [];
        const delimiter = lines[0].includes('\t') ? '\t' : ',';
        const headers = lines[0].split(delimiter).map(h => h.trim().toLowerCase());
        return lines.slice(1).map(line => {
            const values = line.split(delimiter);
            let obj = {};
            headers.forEach((h, i) => {
                let val = values[i] ? values[i].trim() : "";
                if (["capacity", "lat", "lng", "days"].includes(h)) val = parseFloat(val.replace(/[^0-9.-]/g, "")) || 0;
                obj[h] = val;
            });
            return obj;
        });
    }

    function flyToTarget(lat, lng, zoom, marker = null) { const offset = document.getElementById('sidebar').classList.contains('hidden') ? 0 : 360; const targetPoint = map.project([lat, lng], zoom).subtract([offset / 2, 0]); map.flyTo(map.unproject(targetPoint, zoom), zoom, { duration: 1.5 }); if(marker) map.once('moveend', () => marker.openPopup()); }
    function resetToGlobal() { map.flyTo([20, 100], 3, { duration: 1.2 }); }

    async function switchProduct(prod) {
        currentProd = prod;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + prod).classList.add('active');
        const overlay = document.getElementById('sync-overlay');
        overlay.style.display = 'flex'; overlay.style.opacity = '1';
        try {
            const response = await fetch(SHEET_URLS[prod] + "&t=" + new Date().getTime());
            if (!response.ok) throw new Error("Blocked");
            const data = parseUniversal(await response.text());
            document.getElementById('data-mode').innerText = "LIVE SYNC"; document.getElementById('data-mode').style.background = "#2ECC71";
            renderEverything(data, prod);
            setTimeout(() => { overlay.style.opacity = '0'; setTimeout(() => { overlay.style.display = 'none'; }, 600); }, 1000);
        } catch (e) {
            setTimeout(() => {
                let data = []; const localData = localStorage.getItem(`MANUAL_DATA_${prod}`);
                if (localData) { data = JSON.parse(localData); document.getElementById('data-mode').innerText = "MEMORY MODE"; }
                else { try { if (prod === 'SM') data = (typeof data_sm !== 'undefined') ? data_sm : []; if (prod === 'AN') data = (typeof data_an !== 'undefined') ? data_an : []; if (prod === 'BD') data = (typeof data_bd !== 'undefined') ? data_bd : []; document.getElementById('data-mode').innerText = "FIXED MODE"; } catch(err) { console.error(err); } }
                document.getElementById('data-mode').style.background = "#E74C3C"; renderEverything(data, prod);
                setTimeout(() => { overlay.style.opacity = '0'; setTimeout(() => { overlay.style.display = 'none'; }, 600); }, 1000);
            }, 1000);
        }
    }

    function renderEverything(data, prodName) {
        activeMarkers.forEach(m => map.removeLayer(m)); activeMarkers = [];
        document.getElementById('current-risk-list').innerHTML = ''; document.getElementById('future-risk-list').innerHTML = ''; document.getElementById('region-list').innerHTML = '';
        if (!data || data.length === 0) return;
        const globalTotalCapa = data.reduce((s, p) => s + (parseFloat(p.capacity) || 0), 0);
        document.getElementById('global-val').innerText = Math.round(globalTotalCapa).toLocaleString(); document.getElementById('total-sites').innerText = data.length;
        let curLoss = 0, futLoss = 0; const regions = {};
        
        data.forEach(p => {
            if(!p.lat || !p.lng) return;
            const status = p.status || "Normal"; const capa = parseFloat(p.capacity) || 0; const days = parseFloat(p.days) || 0;
            const period = p.period || "-";
            const isCur = status.includes('Current'); const isFut = status.includes('Future'); const loss = ((capa / 365) * days).toFixed(1);
            if(isCur) curLoss += parseFloat(loss); if(isFut) futLoss += parseFloat(loss);
            const baseSize = Math.sqrt(capa) * 0.55; let marker;
            if (isCur || isFut) { const color = isCur ? '#1A1A1B' : '#D35400'; marker = L.marker([p.lat, p.lng], { icon: L.divIcon({ html: `<svg width="${baseSize*2.2}" height="${baseSize*2.2}" viewBox="0 0 24 24"><path d="M12 2L2 22H22L12 2Z" fill="${color}" stroke="${isCur?'none':'#A04000'}" stroke-width="${isCur?0:2}"/></svg>`, className: 'custom-triangle', iconSize: [baseSize*2.2, baseSize*2.2], iconAnchor: [baseSize*1.1, baseSize*1.1] }) }).addTo(map); }
            else { const regionMap = { "NEA": "#5DADE2", "SEA": "#48C9B0", "NA": "#52BE80", "WE": "#AF7AC5" }; marker = L.circleMarker([p.lat, p.lng], { radius: baseSize, fillColor: regionMap[p.region] || "#BDC3C7", color: "#333", weight: 1.5, fillOpacity: 0.85, stroke: true }).addTo(map); }
            
            // ★ 팝업 정보 강화 (Days, Period 추가)
            marker.bindPopup(`
                <div style="font-family:'Pretendard';">
                    <b style="font-size:1.1rem; color:var(--primary);">${p.company}</b><br>
                    <hr style="margin:5px 0; border:0; border-top:1px solid #eee;">
                    <b>Capa:</b> ${capa}K MT<br>
                    <b>Status:</b> ${status}<br>
                    <b>Period:</b> ${period}<br>
                    <b>Days:</b> ${days} days
                </div>
            `);
            marker.on('click', (e) => { L.DomEvent.stopPropagation(e); flyToTarget(p.lat, p.lng, 7, marker); });
            activeMarkers.push(marker); p._m = marker;

            const reg = p.region || "Unknown"; const cou = p.country || "Other";
            if (!regions[reg]) regions[reg] = { name: reg, countries: {}, totalPlants: 0, totalCapa: 0, sumLat: 0, sumLng: 0 };
            if (!regions[reg].countries[cou]) regions[reg].countries[cou] = { name: cou, plants: [], countryCapa: 0, sumLat: 0, sumLng: 0 };
            
            const createCard = (showShare = true) => {
                const card = document.createElement('div'); card.className = 'plant-card';
                card.innerHTML = `${(isCur||isFut)?`<span class="loss-badge">${loss}K</span>`:''}<b>${p.company}</b> ${showShare?`<span style="color:#1597BB">(${((capa/globalTotalCapa)*100).toFixed(1)}%)</span>`:''}<div style="color:#666; font-size:0.65rem;">${capa}K | ${status}</div>`;
                // ★ 리스트 클릭 시 해당 마커로 점프 기능 ★
                card.onclick = (e) => { e.stopPropagation(); flyToTarget(p.lat, p.lng, 7, p._m); };
                return card;
            };
            
            const cardForList = createCard(true);
            if(isCur) document.getElementById('current-risk-list').appendChild(createCard(false));
            else if(isFut) document.getElementById('future-risk-list').appendChild(createCard(false));
            
            regions[reg].countries[cou].plants.push(cardForList);
            regions[reg].countries[cou].countryCapa += capa;
            regions[reg].countries[cou].sumLat += p.lat; regions[reg].countries[cou].sumLng += p.lng;
            regions[reg].totalPlants++; regions[reg].totalCapa += capa;
            regions[reg].sumLat += p.lat; regions[reg].sumLng += p.lng;
        });

        document.getElementById('cur-ratio').innerText = globalTotalCapa > 0 ? ((curLoss/globalTotalCapa)*100).toFixed(2) + "%" : "0.00%";
        document.getElementById('fut-ratio').innerText = globalTotalCapa > 0 ? ((futLoss/globalTotalCapa)*100).toFixed(2) + "%" : "0.00%";
        document.getElementById('cur-sum-h').innerText = curLoss.toFixed(1) + "K ▼"; document.getElementById('fut-sum-h').innerText = futLoss.toFixed(1) + "K ▼";

        Object.values(regions).sort((a,b) => b.totalPlants - a.totalPlants).forEach(r => {
            const rDiv = document.createElement('div');
            rDiv.innerHTML = `<div class="group-header region-header" onclick="this.parentElement.classList.toggle('open'); flyToTarget(${r.sumLat/r.totalPlants}, ${r.sumLng/r.totalPlants}, 4);">
                                <span>${r.name} (${r.totalPlants}) <span class="header-stats" style="color:#C0392B;">${Math.round(r.totalCapa).toLocaleString()}K (${((r.totalCapa/globalTotalCapa)*100).toFixed(1)}%)</span></span><span>▼</span></div><div class="collapsible-content"></div>`;
            const rCont = rDiv.querySelector('.collapsible-content');
            Object.values(r.countries).sort((a,b) => b.countryCapa - a.countryCapa).forEach(c => {
                const cDiv = document.createElement('div');
                cDiv.innerHTML = `<div class="group-header country-header" onclick="this.parentElement.classList.toggle('open'); flyToTarget(${c.sumLat/c.plants.length}, ${c.sumLng/c.plants.length}, 5.5);">
                                    <span>${c.name} (${c.plants.length}) <span class="header-stats" style="color:#1597BB; font-size:0.8rem;">${Math.round(c.countryCapa).toLocaleString()}K (${((c.countryCapa/globalTotalCapa)*100).toFixed(1)}%)</span></span><span>▼</span></div><div class="collapsible-content"></div>`;
                const cCont = cDiv.querySelector('.collapsible-content');
                c.plants.forEach(pCard => cCont.appendChild(pCard));
                rCont.appendChild(cDiv);
            });
            document.getElementById('region-list').appendChild(rDiv);
        });
    }
    window.onload = () => switchProduct('SM');
</script>
</body>
</html>
