<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Global Chemical BI Dashboard | Live Sync</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #0A2647; --accent: #1597BB; --current: #1A1A1B; --future: #F1C40F; --bg: #F0F5F9; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        #layout { display: flex; height: 100vh; width: 100vw; position: relative; }
        #map { flex-grow: 1; height: 100%; background: #DAEAF1; z-index: 1; }
        
        /* Sidebar Styles */
        #sidebar { position: absolute; left: 0; top: 0; width: 320px; height: 100%; background: white; z-index: 2000; transition: transform 0.4s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        #sidebar.hidden { transform: translateX(-100%); }
        #toggle-btn { position: absolute; right: -45px; top: 20px; width: 45px; height: 45px; background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 0 8px 8px 0; font-size: 18px; z-index: 2001; }
        
        .product-tabs { display: flex; background: #051937; padding: 5px; gap: 4px; }
        .tab-btn { flex: 1; padding: 12px 5px; border: none; background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-weight: bold; font-size: 0.75rem; border-radius: 4px; transition: 0.2s; }
        .tab-btn.active { background: var(--accent); box-shadow: inset 0 -3px 0 white; }
        
        .header { background: var(--primary); color: white; padding: 15px; }
        .global-cap { background: var(--accent); padding: 12px 15px; color: white; border-bottom: 3px solid rgba(0,0,0,0.1); }
        
        #list-container { flex-grow: 1; overflow-y: auto; background: var(--bg); }
        .group-header { padding: 10px 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.8rem; align-items: center; }
        .risk-header-current { background: var(--current); color: white; }
        .risk-header-future { background: var(--future); color: #333; }
        .region-header { background: #cbdceb; color: var(--primary); }
        
        .collapsible-content { display: none; }
        .open > .collapsible-content { display: block; }
        
        .plant-card { padding: 10px 12px 10px 30px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.72rem; background: white; position: relative; transition: 0.2s; }
        .plant-card:hover { background: #f0f7ff; }
        .plant-card.current-risk { border-left: 5px solid var(--current); }
        .plant-card.future-risk { border-left: 5px solid var(--future); }
        
        .loss-badge { background: #E74C3C; color: white; font-weight: bold; padding: 1px 6px; border-radius: 10px; font-size: 0.6rem; position: absolute; right: 10px; top: 8px; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; background: rgba(0,0,0,0.85); color: white; padding: 25px 40px; border-radius: 15px; display: none; text-align: center; }
    </style>
</head>
<body>

<div id="loading">📊 구글 시트에서 최신 데이터를 가져오는 중...</div>

<div id="layout">
    <div id="sidebar">
        <button id="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('hidden')">☰</button>
        <div class="product-tabs">
            <button class="tab-btn active" id="btn-SM" onclick="switchProduct('SM')">SM</button>
            <button class="tab-btn" id="btn-AN" onclick="switchProduct('AN')">AN</button>
            <button class="tab-btn" id="btn-BD" onclick="switchProduct('BD')">BD</button>
        </div>
        <div class="header">
            <h1 id="prod-title" style="margin:0; font-size:0.9rem;">Chemical Supply Map</h1>
            <p style="margin:3px 0 0 0; font-size:0.6rem; opacity:0.8;">2026 Live Intelligence Business Unit</p>
        </div>
        <div class="global-cap">
            <span style="font-size:0.62rem; opacity:0.9;">Global Total Capacity</span><br>
            <strong id="global-val" style="font-size:1.1rem;">0</strong> <small>K MT/Y</small>
        </div>
        <div id="list-container">
            <div id="current-risk-group" class="open">
                <div class="group-header risk-header-current" onclick="this.parentElement.classList.toggle('open')"><span>⚠️ CURRENT RISK</span><span id="cur-sum-h" style="font-size:0.65rem;"></span></div>
                <div class="collapsible-content" id="current-risk-list"></div>
            </div>
            <div id="future-risk-group" class="open">
                <div class="group-header risk-header-future" onclick="this.parentElement.classList.toggle('open')"><span>📅 FUTURE MAINT</span><span id="fut-sum-h" style="font-size:0.65rem;"></span></div>
                <div class="collapsible-content" id="future-risk-list"></div>
            </div>
            <div id="region-list"></div>
        </div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- ★ 사장님이 주신 URL이 완벽하게 적용되었습니다 ★ ---
    const sheetURLs = {
        'SM': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=0&single=true&output=csv',
        'AN': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=263516767&single=true&output=csv',
        'BD': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=607848019&single=true&output=csv'
    };

    const map = L.map('map', {zoomControl: false}).setView([20, 110], 3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let activeMarkers = [];

    function parseCSV(csv) {
        const lines = csv.split("\n");
        const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
        return lines.slice(1).filter(l => l.trim() !== "").map(line => {
            const values = line.split(",");
            let obj = {};
            headers.forEach((h, i) => {
                let val = values[i] ? values[i].trim() : "";
                if (["capacity", "lat", "lng", "days"].includes(h)) val = parseFloat(val) || 0;
                obj[h] = val;
            });
            return obj;
        });
    }

    async function switchProduct(prod) {
        document.getElementById('loading').style.display = 'block';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + prod).classList.add('active');

        try {
            const response = await fetch(sheetURLs[prod] + "&cache=" + new Date().getTime());
            const csvText = await response.text();
            const data = parseCSV(csvText);
            renderDashboard(data, prod);
        } catch (e) {
            console.error(e);
            alert("시트 데이터를 가져오지 못했습니다. 게시 설정을 확인해 주세요.");
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function renderDashboard(data, prodName) {
        activeMarkers.forEach(m => map.removeLayer(m));
        activeMarkers = [];
        document.getElementById('current-risk-list').innerHTML = '';
        document.getElementById('future-risk-list').innerHTML = '';
        document.getElementById('region-list').innerHTML = '';

        const totalCapa = data.reduce((s, p) => s + p.capacity, 0);
        document.getElementById('global-val').innerText = totalCapa.toLocaleString();
        document.getElementById('prod-title').innerText = `Global ${prodName} Plant Status`;

        let curLossTotal = 0;
        let futLossTotal = 0;

        // 리스크 계산 및 시각화 로직
        data.forEach(p => {
            const isCur = p.status.includes('Current');
            const isFut = p.status.includes('Future');
            const loss = ((p.capacity / 365) * (p.days || 0)).toFixed(1);
            
            if(isCur) curLossTotal += parseFloat(loss);
            if(isFut) futLossTotal += parseFloat(loss);

            const color = isCur ? '#1A1A1B' : (isFut ? '#F1C40F' : '#1597BB');
            const marker = L.circleMarker([p.lat, p.lng], {
                radius: Math.sqrt(p.capacity) * (prodName === 'BD' ? 0.7 : 0.6),
                fillColor: color, color: '#fff', weight: isCur || isFut ? 3 : 1, fillOpacity: 0.8
            }).addTo(map);

            const popupContent = `<b>${p.company}</b><br>${p.location}<br>Capa: ${p.capacity}K<br>Status: ${p.status}${isCur||isFut ? '<br><span style="color:red">Loss: '+loss+'K</span>' : ''}`;
            marker.bindPopup(popupContent);
            activeMarkers.push(marker);

            // 카드 리스트 생성
            const card = document.createElement('div');
            card.className = `plant-card ${isCur?'current-risk':(isFut?'future-risk':'')}`;
            card.innerHTML = `${isCur||isFut ? '<span class="loss-badge">'+loss+'K Loss</span>' : ''}<b>${p.company}</b><div class="capa-info">${p.capacity}K MT | ${p.status}</div>`;
            card.onclick = () => { 
                const offset = document.getElementById('sidebar').classList.contains('hidden') ? 0 : 160;
                map.flyTo([p.lat, p.lng], 8); 
                setTimeout(() => marker.openPopup(), 500); 
            };

            if(isCur) document.getElementById('current-risk-list').appendChild(card);
            else if(isFut) document.getElementById('future-risk-list').appendChild(card);
        });

        document.getElementById('cur-sum-h').innerText = curLossTotal.toFixed(1) + "K MT Loss";
        document.getElementById('fut-sum-h').innerText = futLossTotal.toFixed(1) + "K MT Loss";
    }

    window.onload = () => switchProduct('SM');
</script>
</body>
</html>
