<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Global Supply Control Tower | JS KIM</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #0A2647; --accent: #1597BB; --current: #1A1A1B; --future: #D35400; --bg: #F0F5F9; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        #layout { display: flex; height: 100vh; width: 100vw; position: relative; }
        #map { flex-grow: 1; height: 100%; background: #DAEAF1; z-index: 1; }
        
        /* 마커 움직임 완전 동기화 */
        .leaflet-marker-icon { transition: none !important; }
        .leaflet-zoom-animated { transition-duration: 0.5s !important; }

        #sidebar { position: absolute; left: 0; top: 0; width: 360px; height: 100%; background: white; z-index: 2000; transition: transform 0.5s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        #sidebar.hidden { transform: translateX(-100%); }
        #toggle-btn { position: absolute; right: -45px; top: 20px; width: 45px; height: 45px; background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 0 8px 8px 0; font-size: 18px; z-index: 2001; }
        
        .product-tabs { display: flex; background: #051937; padding: 5px; gap: 4px; }
        .tab-btn { flex: 1; padding: 12px 2px; border: none; background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-weight: bold; font-size: 0.75rem; border-radius: 4px; }
        .tab-btn.active { background: var(--accent); color: white; }
        
        .header { background: var(--primary); color: white; padding: 22px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .created-by { font-size: 1.3rem; color: #FFD700; font-weight: 900; margin-bottom: 12px; display: block; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); letter-spacing: 0.5px; }
        
        #prod-title { margin: 0; font-size: 1.25rem; letter-spacing: -0.5px; cursor: pointer; transition: 0.2s; }
        #prod-title:hover { color: #FFD700; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; background: var(--accent); color: white; gap: 1px; border-top: 1px solid rgba(255,255,255,0.2); }
        .metric-box { padding: 10px; background: var(--accent); text-align: center; }
        .metric-label { font-size: 0.55rem; opacity: 0.9; display: block; }
        .metric-value { font-size: 0.95rem; font-weight: bold; }

        #list-container { flex-grow: 1; overflow-y: auto; background: var(--bg); }
        .group-header { padding: 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.8rem; align-items: center; }
        .risk-header-current { background: var(--current); color: white; }
        .risk-header-future { background: var(--future); color: white; }
        .region-header { background: #cbdceb; color: var(--primary); margin-top: 2px; }
        
        .collapsible-content { display: none; }
        .open > .collapsible-content { display: block; }
        
        .plant-card { padding: 10px 12px 10px 30px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.72rem; background: white; position: relative; }
        .share-tag { font-size: 0.6rem; color: #1597BB; font-weight: bold; margin-left: 5px; }
        .loss-badge { background: #E74C3C; color: white; font-weight: bold; padding: 1px 6px; border-radius: 10px; font-size: 0.6rem; position: absolute; right: 10px; top: 10px; }
        
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; }
        .custom-triangle svg { filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2)); display: block; overflow: visible; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div style="font-size:1.5rem; color:#0A2647;">📡 LAM Global Intelligence Syncing...</div>
    <div style="color:#1597BB; margin-top:10px;">Created by JS KIM of LAM</div>
</div>

<div id="layout">
    <div id="sidebar">
        <button id="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('hidden')">📊</button>
        <div class="product-tabs">
            <button class="tab-btn active" id="btn-SM" onclick="switchProduct('SM')">SM</button>
            <button class="tab-btn" id="btn-AN" onclick="switchProduct('AN')">AN</button>
            <button class="tab-btn" id="btn-BD" onclick="switchProduct('BD')">BD</button>
        </div>
        <div class="header">
            <span class="created-by">CREATED BY JS KIM OF LAM</span>
            <h1 id="prod-title" onclick="resetToGlobal()" title="전체 지도로 리셋">Global Supply Control Map</h1>
        </div>
        
        <div class="metrics-grid">
            <div class="metric-box">
                <span class="metric-label">GLOBAL CAPA (K)</span>
                <span class="metric-value" id="global-val">0</span>
            </div>
            <div class="metric-box">
                <span class="metric-label">TOTAL SITES</span>
                <span class="metric-value" id="total-sites">0</span>
            </div>
            <div class="metric-box" style="background: #1A1A1B;">
                <span class="metric-label">CUR. LOSS RATIO</span>
                <span class="metric-value" id="cur-ratio" style="color:#E74C3C">0%</span>
            </div>
            <div class="metric-box" style="background: #D35400;">
                <span class="metric-label">FUT. LOSS RATIO</span>
                <span class="metric-value" id="fut-ratio" style="color:#F1C40F">0%</span>
            </div>
        </div>

        <div id="list-container">
            <div id="current-risk-group" class="open">
                <div class="group-header risk-header-current" onclick="this.parentElement.classList.toggle('open')"><span>⚠️ CURRENT RISK</span><span id="cur-sum-h" style="font-size:0.65rem;"></span></div>
                <div class="collapsible-content" id="current-risk-list"></div>
            </div>
            <div id="future-risk-group" class="open">
                <div class="group-header risk-header-future" onclick="this.parentElement.classList.toggle('open')"><span>📅 FUTURE MAINT</span><span id="fut-sum-h" style="font-size:0.65rem;"></span></div>
                <div class="collapsible-content" id="future-risk-list"></div>
            </div>
            <div style="background: var(--primary); color:white; padding:10px 12px; font-size:0.75rem; font-weight:bold; margin-top:10px;">🌐 REGIONAL DIRECTORY</div>
            <div id="region-list"></div>
        </div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const sheetURLs = {
        'SM': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=0&single=true&output=csv',
        'AN': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=263516767&single=true&output=csv',
        'BD': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=607848019&single=true&output=csv'
    };

    const regionStyles = {
        "NEA": { fill: "#5DADE2", border: "#2E86C1" }, "SEA": { fill: "#48C9B0", border: "#16A085" }, "NA": { fill: "#52BE80", border: "#1E8449" }, "WE": { fill: "#AF7AC5", border: "#7D3C98" },
        "CE": { fill: "#9B59B6", border: "#6C3483" }, "CIS": { fill: "#EB984E", border: "#A04000" }, "ME": { fill: "#EC7063", border: "#B03A2E" }, "AFRICA": { fill: "#A04000", border: "#5D2300" },
        "SA": { fill: "#58D68D", border: "#239B56" }, "IND": { fill: "#F4D03F", border: "#B7950B" }, "Other": { fill: "#BDC3C7", border: "#7F8C8D" }
    };

    const map = L.map('map', {zoomControl: false, zoomAnimation: true}).setView([20, 100], 3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let activeMarkers = [];

    // ★ BPA 코드의 핵심: 오프셋 이동 함수 ★
    function moveToPlant(lat, lng) {
        const sidebar = document.getElementById('sidebar');
        const isHidden = sidebar.classList.contains('hidden');
        const offset = isHidden ? 0 : 360; // 사이드바 너비
        
        // 업체를 사이드바 오른쪽의 빈 공간 정중앙에 배치하는 수학적 계산
        const targetPoint = map.project([lat, lng], 9).subtract([offset / 2, 0]);
        map.flyTo(map.unproject(targetPoint, 9), 9, {
            duration: 1.8,
            easeLinearity: 0.25
        });
    }

    function resetToGlobal() { map.flyTo([20, 100], 3, { duration: 1.5 }); }

    async function switchProduct(prod) {
        document.getElementById('loading-overlay').style.display = 'flex';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + prod).classList.add('active');

        Papa.parse(sheetURLs[prod] + "?t=" + new Date().getTime(), {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                const data = results.data.filter(row => row.Company);
                document.getElementById('btn-' + prod).innerText = `${prod} (${data.length})`;
                renderEverything(data, prod);
                document.getElementById('loading-overlay').style.display = 'none';
            }
        });
    }

    function renderEverything(data, prodName) {
        activeMarkers.forEach(m => map.removeLayer(m));
        activeMarkers = [];
        document.getElementById('current-risk-list').innerHTML = '';
        document.getElementById('future-risk-list').innerHTML = '';
        document.getElementById('region-list').innerHTML = '';

        const globalTotalCapa = data.reduce((s, p) => s + (Number(p.Capacity) || 0), 0);
        document.getElementById('global-val').innerText = Math.round(globalTotalCapa).toLocaleString();
        document.getElementById('total-sites').innerText = data.length;

        let curLoss = 0, futLoss = 0;
        const regions = {};

        data.forEach(p => {
            if(!p.Lat || !p.Lng) return;
            const isCur = p.Status && p.Status.includes('Current');
            const isFut = p.Status && p.Status.includes('Future');
            const loss = ((p.Capacity / 365) * (p.Days || 0)).toFixed(1);
            
            if(isCur) curLoss += parseFloat(loss);
            if(isFut) futLoss += parseFloat(loss);

            // 마커 생성 (세모/동그라미 톤온톤 유지)
            let marker;
            const baseSize = Math.sqrt(p.Capacity) * 0.55;
            if (isCur || isFut) {
                const color = isCur ? '#1A1A1B' : '#D35400';
                const iconSize = baseSize * 2.2;
                marker = L.marker([p.Lat, p.Lng], {
                    icon: L.divIcon({
                        html: `<svg width="${iconSize}" height="${iconSize}" viewBox="0 0 24 24"><path d="M12 2L2 22H22L12 2Z" fill="${color}" stroke="${isCur?'none':'#A04000'}" stroke-width="${isCur?0:2}"/></svg>`,
                        className: 'custom-triangle', iconSize: [iconSize, iconSize], iconAnchor: [iconSize/2, iconSize/2]
                    })
                }).addTo(map);
            } else {
                const style = Object.entries(regionStyles).find(([k]) => p.Region && p.Region.includes(k))?.[1] || regionStyles.Other;
                marker = L.circleMarker([p.Lat, p.Lng], {
                    radius: baseSize, fillColor: style.fill, color: style.border, weight: 1.5, fillOpacity: 0.85, stroke: true
                }).addTo(map);
            }
            
            marker.bindPopup(`<b>${p.Company}</b><br>${p.Location}<br>Capa: ${p.Capacity}K<br>Status: ${p.Status}`);
            marker.on('click', (e) => moveToPlant(p.Lat, p.Lng));
            activeMarkers.push(marker);
            p._m = marker;

            // 카드 생성
            const createCard = (showShare = true) => {
                const share = ((p.Capacity / globalTotalCapa) * 100).toFixed(1);
                const card = document.createElement('div');
                card.className = `plant-card ${isCur?'current-risk':(isFut?'future-risk':'')}`;
                card.innerHTML = `${(isCur||isFut) ? `<span class="loss-badge">${loss}K Loss</span>` : ''}<b>${p.Company}</b>${showShare ? `<span class="share-tag">(${share}%)</span>` : ''}<div class="capa-info">${p.Capacity}K MT | ${p.Status}</div>`;
                card.onclick = () => { moveToPlant(p.Lat, p.Lng); setTimeout(() => p._m.openPopup(), 1600); };
                return card;
            };

            if(isCur) document.getElementById('current-risk-list').appendChild(createCard(false));
            else if(isFut) document.getElementById('future-risk-list').appendChild(createCard(false));

            if (!regions[p.Region]) regions[p.Region] = { name: p.Region, countries: {}, totalPlants: 0, totalCapa: 0 };
            if (!regions[p.Region].countries[p.Country]) regions[p.Region].countries[p.Country] = [];
            regions[p.Region].countries[p.Country].push(createCard(true));
            regions[p.Region].totalPlants++;
            regions[p.Region].totalCapa += p.Capacity;
        });

        // 수치 업데이트
        document.getElementById('cur-ratio').innerText = ((curLoss / globalTotalCapa) * 100).toFixed(2) + "%";
        document.getElementById('fut-ratio').innerText = ((futLoss / globalTotalCapa) * 100).toFixed(2) + "%";
        document.getElementById('cur-sum-h').innerText = curLoss.toFixed(1) + "K Loss ▼";
        document.getElementById('fut-sum-h').innerText = futLoss.toFixed(1) + "K Loss ▼";

        // 리스트 렌더링
        Object.values(regions).sort((a,b) => b.totalPlants - a.totalPlants).forEach(r => {
            const rShare = ((r.totalCapa / globalTotalCapa) * 100).toFixed(1);
            const rDiv = document.createElement('div');
            rDiv.innerHTML = `<div class="group-header region-header" onclick="this.parentElement.classList.toggle('open')"><span>${r.name} (${r.totalPlants})<br><small style="font-weight:normal; font-size:0.6rem; opacity:0.8;">${Math.round(r.totalCapa).toLocaleString()}K (${rShare}%)</small></span><span>▼</span></div><div class="collapsible-content"></div>`;
            const rCont = rDiv.querySelector('.collapsible-content');
            Object.keys(r.countries).sort().forEach(c => {
                const cDiv = document.createElement('div');
                cDiv.innerHTML = `<div class="group-header country-header" onclick="this.parentElement.classList.toggle('open')"><span>${c} (${r.countries[c].length})</span><span>▼</span></div><div class="collapsible-content"></div>`;
                const cCont = cDiv.querySelector('.collapsible-content');
                r.countries[c].forEach(card => cCont.appendChild(card));
                rCont.appendChild(cDiv);
            });
            document.getElementById('region-list').appendChild(rDiv);
        });
    }

    window.onload = () => switchProduct('SM');
</script>
</body>
</html>
