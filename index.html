<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Global Supply Control Tower | JS KIM (v9.1 Security)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="data/data_sm.js"></script>
    <script src="data/data_an.js"></script>
    <script src="data/data_bd.js"></script>

    <style>
        :root { --primary: #0A2647; --accent: #1597BB; --current: #1A1A1B; --future: #D35400; --bg: #F0F5F9; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        #layout { display: flex; height: 100vh; width: 100vw; position: relative; }
        #map { flex-grow: 1; height: 100%; background: #DAEAF1; z-index: 1; }
        
        .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-popup { 
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            will-change: transform; transition: none !important; 
        }
        
        #sidebar { position: absolute; left: 0; top: 0; width: 360px; height: 100%; background: white; z-index: 2000; transition: transform 0.4s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        #sidebar.hidden { transform: translateX(-100%); }
        #toggle-btn { position: absolute; right: -45px; top: 20px; width: 45px; height: 45px; background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 0 8px 8px 0; font-size: 18px; z-index: 2001; }
        
        .header { background: var(--primary); color: white; padding: 22px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); position: relative; }
        .created-by { font-size: 1.3rem; color: #FFD700; font-weight: 900; margin-bottom: 12px; display: block; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        
        #data-mode { position: absolute; right: 15px; top: 15px; font-size: 0.7rem; font-weight: 900; padding: 4px 10px; border-radius: 15px; background: #95a5a6; color: white; cursor: pointer; z-index: 2002; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .product-tabs { display: flex; background: #051937; padding: 5px; gap: 4px; }
        .tab-btn { flex: 1; padding: 12px 2px; border: none; background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-weight: bold; font-size: 0.75rem; border-radius: 4px; }
        .tab-btn.active { background: var(--accent); color: white; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; background: var(--accent); color: white; gap: 1px; }
        .metric-box { padding: 10px; background: var(--accent); text-align: center; }
        .metric-value { font-size: 1.2rem; font-weight: 900; }

        #list-container { flex-grow: 1; overflow-y: auto; background: var(--bg); }
        .group-header { padding: 14px 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.85rem; align-items: center; }
        .region-header { background: #cbdceb; color: var(--primary); margin-top: 2px; }
        .header-stats { font-weight: 900; display: block; margin-top: 4px; font-size: 0.85rem; }
        
        .collapsible-content { display: none; }
        .open > .collapsible-content { display: block; }
        
        .plant-card { padding: 10px 12px 10px 30px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.72rem; background: white; position: relative; }
        .loss-badge { background: #E74C3C; color: white; font-weight: bold; padding: 2px 6px; border-radius: 10px; font-size: 0.6rem; position: absolute; right: 10px; top: 10px; }
        
        #update-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 420px; background: white; z-index: 11000; padding: 25px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5); border-radius: 20px; display: none;
        }
        #update-modal textarea { width: 100%; height: 200px; margin: 10px 0; font-size: 0.75rem; border: 1px solid #ddd; border-radius: 5px; padding: 8px; box-sizing: border-box; }
        #admin-password { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid var(--primary); border-radius: 5px; box-sizing: border-box; font-weight: bold; }

        #sync-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 38, 71, 0.96); z-index: 10000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; transition: opacity 0.4s ease;
        }
        .sync-spinner { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #FFD700; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .custom-triangle svg { filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2)); display: block; }
    </style>
</head>
<body>

<div id="update-modal">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin:0; color:var(--primary);">🔒 Admin Control Center</h3>
        <span style="font-size: 0.7rem; color: #999;">JS KIM OF LAM</span>
    </div>
    <label style="font-size:0.8rem; font-weight:bold;">Admin Password</label>
    <input type="password" id="admin-password" placeholder="관리자 암호를 입력하세요">
    
    <label style="font-size:0.8rem; font-weight:bold;">CSV Data Paste</label>
    <textarea id="csv-input" placeholder="구글 시트 전체 복사 후 여기에 붙여넣기"></textarea>
    
    <button style="background:var(--primary); color:white; padding:15px; width:100%; border:none; border-radius:10px; cursor:pointer; font-weight:900; font-size:1rem; margin-top:5px;" onclick="saveManualData()">보안 메모리에 즉시 저장</button>
    <button style="width:100%; margin-top:10px; border:none; padding:10px; border-radius:8px; cursor:pointer; background:#f5f5f5; color:#666;" onclick="document.getElementById('update-modal').style.display='none'">닫기</button>
</div>

<div id="sync-overlay">
    <div id="sync-icon" class="sync-spinner"></div>
    <div id="sync-main-text" style="font-size: 1.8rem; font-weight: 900; margin-bottom: 12px;">동기화 시도 중...</div>
    <div id="sync-sub-text" style="font-size: 1.1rem; color: #1597BB; font-weight: 500;">Attempting Online Sync...</div>
    <div style="margin-top: 60px; color: #FFD700; font-weight: 900; font-size: 1.4rem;">CREATED BY JS KIM OF LAM</div>
</div>

<div id="layout">
    <div id="sidebar">
        <button id="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('hidden')">☰</button>
        <div class="product-tabs">
            <button class="tab-btn active" id="btn-SM" onclick="switchProduct('SM')">SM</button>
            <button class="tab-btn" id="btn-AN" onclick="switchProduct('AN')">AN</button>
            <button class="tab-btn" id="btn-BD" onclick="switchProduct('BD')">BD</button>
        </div>
        <div class="header">
            <span id="data-mode" onclick="showUpdateModal()">SYNC CHECK</span>
            <span class="created-by">CREATED BY JS KIM OF LAM</span>
            <h1 id="prod-title" onclick="resetToGlobal()" style="margin:0; font-size:1.2rem; cursor:pointer;">Global Supply Control Map</h1>
        </div>
        
        <div class="metrics-grid">
            <div class="metric-box"><span style="font-size:0.6rem; opacity:0.8; display:block;">GLOBAL CAPA</span><span class="metric-value" id="global-val">0</span></div>
            <div class="metric-box"><span style="font-size:0.6rem; opacity:0.8; display:block;">TOTAL SITES</span><span class="metric-value" id="total-sites">0</span></div>
            <div class="metric-box" style="background: #1A1A1B;"><span style="font-size:0.6rem; opacity:0.8; display:block;">CUR. LOSS %</span><span class="metric-value" id="cur-ratio" style="color:#FF4D4D">0.00%</span></div>
            <div class="metric-box" style="background: #D35400;"><span style="font-size:0.6rem; opacity:0.8; display:block;">FUT. LOSS %</span><span class="metric-value" id="fut-ratio" style="color:#FFD700">0.00%</span></div>
        </div>

        <div id="list-container">
            <div id="current-risk-group" class="open">
                <div class="group-header" style="background:var(--current); color:white" onclick="this.parentElement.classList.toggle('open')"><span>⚠️ CURRENT RISK</span><span id="cur-sum-h" style="font-size:0.75rem;"></span></div>
                <div class="collapsible-content" id="current-risk-list"></div>
            </div>
            <div id="future-risk-group" class="open">
                <div class="group-header" style="background:var(--future); color:white" onclick="this.parentElement.classList.toggle('open')"><span>📅 FUTURE MAINT</span><span id="fut-sum-h" style="font-size:0.75rem;"></span></div>
                <div class="collapsible-content" id="future-risk-list"></div>
            </div>
            <div style="background: var(--primary); color:white; padding:10px 12px; font-size:0.75rem; font-weight:bold; margin-top:10px;">🌐 REGIONAL DIRECTORY</div>
            <div id="region-list"></div>
        </div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ★ 관리자 암호 변경: jskim0111 ★
    const ADMIN_PASS = "jskim0111"; 

    const SHEET_URLS = {
        'SM': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=0&single=true&output=csv',
        'AN': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=263516767&single=true&output=csv',
        'BD': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=607848019&single=true&output=csv'
    };

    let currentProd = 'SM';
    const map = L.map('map', {zoomControl: false, zoomAnimation: true, markerZoomAnimation: false}).setView([20, 100], 3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let activeMarkers = [];

    function showUpdateModal() { 
        document.getElementById('admin-password').value = ""; 
        document.getElementById('update-modal').style.display = 'block'; 
    }

    function saveManualData() {
        const pwInput = document.getElementById('admin-password').value;
        const csvInput = document.getElementById('csv-input').value;

        if (pwInput !== ADMIN_PASS) {
            alert("❌ 보안 경고: 관리자 암호가 일치하지 않습니다.");
            return;
        }

        if (!csvInput) {
            alert("데이터를 입력해주세요.");
            return;
        }

        const parsed = parseCSV(csvInput);
        if(parsed.length > 0) {
            localStorage.setItem(`MANUAL_DATA_${currentProd}`, JSON.stringify(parsed));
            alert(`✅ 보안 검증 완료: ${currentProd} 데이터가 사장님 전용 메모리에 저장되었습니다.`);
            document.getElementById('update-modal').style.display = 'none';
            renderEverything(parsed, currentProd);
        } else {
            alert("데이터 형식이 올바르지 않습니다.");
        }
    }

    function flyToTarget(lat, lng, zoom, marker = null) {
        const offset = document.getElementById('sidebar').classList.contains('hidden') ? 0 : 360;
        const targetPoint = map.project([lat, lng], zoom).subtract([offset / 2, 0]);
        map.flyTo(map.unproject(targetPoint, zoom), zoom, { duration: 1.5 });
        if(marker) map.once('moveend', () => marker.openPopup());
    }

    function resetToGlobal() { map.flyTo([20, 100], 3, { duration: 1.2 }); }

    function parseCSV(csv) {
        const lines = csv.split("\n").map(l => l.trim()).filter(l => l.length > 0);
        if(lines.length < 2) return [];
        const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
        return lines.slice(1).map(line => {
            const values = line.split(",");
            let obj = {};
            headers.forEach((h, i) => {
                let val = values[i] ? values[i].trim() : "";
                if (["capacity", "lat", "lng", "days"].includes(h)) val = parseFloat(val.replace(/[^0-9.-]/g, "")) || 0;
                obj[h] = val;
            });
            return obj;
        });
    }

    async function switchProduct(prod) {
        currentProd = prod;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + prod).classList.add('active');
        
        const overlay = document.getElementById('sync-overlay');
        const mainText = document.getElementById('sync-main-text');
        const subText = document.getElementById('sync-sub-text');
        const icon = document.getElementById('sync-icon');

        overlay.style.display = 'flex';
        overlay.style.opacity = '1';
        icon.className = "sync-spinner";
        mainText.innerText = "동기화 시도 중...";
        subText.innerText = "Attempting Online Sync...";

        try {
            const response = await fetch(SHEET_URLS[prod] + "&t=" + new Date().getTime());
            if (!response.ok) throw new Error("Blocked");
            const csvText = await response.text();
            const data = parseCSV(csvText);
            
            mainText.innerText = "온라인 연동 완료";
            subText.innerText = "Online Sync Complete";
            icon.className = "";
            icon.innerHTML = "<div style='font-size:50px;'>✅</div>";
            
            document.getElementById('data-mode').innerText = "LIVE SYNC";
            document.getElementById('data-mode').style.background = "#2ECC71";
            renderEverything(data, prod);
            
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; icon.innerHTML = ""; }, 600);
            }, 800);

        } catch (e) {
            icon.innerHTML = "";
            mainText.innerText = "보안 확인: 픽스 모드로 전환";
            mainText.style.color = "#FF4D4D";
            subText.innerText = "Security Verified: Switching to Fixed Mode";
            
            setTimeout(() => {
                let data = [];
                const localData = localStorage.getItem(`MANUAL_DATA_${prod}`);
                if (localData) {
                    data = JSON.parse(localData);
                    document.getElementById('data-mode').innerText = "MEMORY MODE";
                } else {
                    try {
                        if (prod === 'SM') data = (typeof data_sm !== 'undefined') ? data_sm : [];
                        if (prod === 'AN') data = (typeof data_an !== 'undefined') ? data_an : [];
                        if (prod === 'BD') data = (typeof data_bd !== 'undefined') ? data_bd : [];
                        document.getElementById('data-mode').innerText = "FIXED MODE";
                    } catch(err) { console.error(err); }
                }
                document.getElementById('data-mode').style.background = "#E74C3C";
                renderEverything(data, prod);
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => { overlay.style.display = 'none'; mainText.style.color = "white"; }, 500);
                }, 800);
            }, 800);
        }
    }

    function renderEverything(data, prodName) {
        activeMarkers.forEach(m => map.removeLayer(m));
        activeMarkers = [];
        document.getElementById('current-risk-list').innerHTML = '';
        document.getElementById('future-risk-list').innerHTML = '';
        document.getElementById('region-list').innerHTML = '';

        if (!data || data.length === 0) {
            document.getElementById('global-val').innerText = "0";
            document.getElementById('total-sites').innerText = "0";
            document.getElementById('cur-ratio').innerText = "0.00%";
            document.getElementById('fut-ratio').innerText = "0.00%";
            return;
        }

        const globalTotalCapa = data.reduce((s, p) => s + (parseFloat(p.capacity) || 0), 0);
        document.getElementById('global-val').innerText = Math.round(globalTotalCapa).toLocaleString();
        document.getElementById('total-sites').innerText = data.length;

        let curLoss = 0, futLoss = 0;
        const regions = {};

        data.forEach(p => {
            if(!p.lat || !p.lng) return;
            const status = p.status || "Normal";
            const capa = parseFloat(p.capacity) || 0;
            const days = parseFloat(p.days) || 0;
            const isCur = status.includes('Current');
            const isFut = status.includes('Future');
            const loss = ((capa / 365) * days).toFixed(1);
            if(isCur) curLoss += parseFloat(loss);
            if(isFut) futLoss += parseFloat(loss);

            const baseSize = Math.sqrt(capa) * 0.55;
            let marker;
            if (isCur || isFut) {
                const color = isCur ? '#1A1A1B' : '#D35400';
                marker = L.marker([p.lat, p.lng], {
                    icon: L.divIcon({
                        html: `<svg width="${baseSize*2.2}" height="${baseSize*2.2}" viewBox="0 0 24 24"><path d="M12 2L2 22H22L12 2Z" fill="${color}" stroke="${isCur?'none':'#A04000'}" stroke-width="${isCur?0:2}"/></svg>`,
                        className: 'custom-triangle', iconSize: [baseSize*2.2, baseSize*2.2], iconAnchor: [baseSize*1.1, baseSize*1.1]
                    })
                }).addTo(map);
            } else {
                const regionMap = { "NEA": "#5DADE2", "SEA": "#48C9B0", "NA": "#52BE80", "WE": "#AF7AC5" };
                marker = L.circleMarker([p.lat, p.lng], {
                    radius: baseSize, fillColor: regionMap[p.region] || "#BDC3C7", color: "#333", weight: 1.5, fillOpacity: 0.85, stroke: true
                }).addTo(map);
            }
            marker.bindPopup(`<b>${p.company}</b><br>Capa: ${capa}K<br>Status: ${status}`);
            marker.on('click', (e) => { L.DomEvent.stopPropagation(e); flyToTarget(p.lat, p.lng, 7, marker); });
            activeMarkers.push(marker); p._m = marker;

            const createCard = (showShare = true) => {
                const share = globalTotalCapa > 0 ? ((capa / globalTotalCapa) * 100).toFixed(1) : 0;
                const card = document.createElement('div');
                card.className = 'plant-card';
                card.innerHTML = `${(isCur||isFut)?`<span class="loss-badge">${loss}K Loss</span>`:''}<b>${p.company}</b>${showShare?`<span style="color:#1597BB; font-weight:bold; margin-left:5px;">(${share}%)</span>`:''}<div style="color:#666; font-size:0.65rem;">${capa}K MT | ${status}</div>`;
                card.onclick = () => flyToTarget(p.lat, p.lng, 7, p._m);
                return card;
            };

            if(isCur) document.getElementById('current-risk-list').appendChild(createCard(false));
            else if(isFut) document.getElementById('future-risk-list').appendChild(createCard(false));

            if (!regions[p.region]) regions[p.region] = { name: p.region, totalPlants: 0, totalCapa: 0, sumLat: 0, sumLng: 0 };
            regions[p.region].totalPlants++;
            regions[p.region].totalCapa += capa;
            regions[p.region].sumLat += p.lat;
            regions[p.region].sumLng += p.lng;
        });

        document.getElementById('cur-ratio').innerText = globalTotalCapa > 0 ? ((curLoss / globalTotalCapa) * 100).toFixed(2) + "%" : "0.00%";
        document.getElementById('fut-ratio').innerText = globalTotalCapa > 0 ? ((futLoss / globalTotalCapa) * 100).toFixed(2) + "%" : "0.00%";
        document.getElementById('cur-sum-h').innerText = curLoss.toFixed(1) + "K Loss ▼";
        document.getElementById('fut-sum-h').innerText = futLoss.toFixed(1) + "K Loss ▼";

        Object.values(regions).forEach(r => {
            const rShare = globalTotalCapa > 0 ? ((r.totalCapa / globalTotalCapa) * 100).toFixed(1) : 0;
            const rDiv = document.createElement('div');
            rDiv.innerHTML = `<div class="group-header region-header" onclick="this.parentElement.classList.toggle('open'); flyToTarget(${r.sumLat/r.totalPlants}, ${r.sumLng/r.totalPlants}, 4);">
                                <span>${r.name} (${r.totalPlants})<span class="header-stats" style="color:#C0392B;">${Math.round(r.totalCapa).toLocaleString()}K (${rShare}%)</span></span><span>▼</span></div>`;
            document.getElementById('region-list').appendChild(rDiv);
        });
    }
    window.onload = () => switchProduct('SM');
</script>
</body>
</html>
