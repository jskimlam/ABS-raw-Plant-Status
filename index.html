<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Global Chemical Control Tower | JS KIM</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #0A2647; --accent: #1597BB; --current: #1A1A1B; --future: #E67E22; --bg: #F0F5F9; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        #layout { display: flex; height: 100vh; width: 100vw; position: relative; }
        #map { flex-grow: 1; height: 100%; background: #DAEAF1; z-index: 1; }
        
        /* 마커 움직임 애니메이션 최적화 */
        .leaflet-marker-icon, .leaflet-zoom-animated {
            transition: transform 0.3s cubic-bezier(0,0,0.2,1), width 0.3s, height 0.3s;
        }

        #sidebar { position: absolute; left: 0; top: 0; width: 360px; height: 100%; background: white; z-index: 2000; transition: transform 0.4s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        #sidebar.hidden { transform: translateX(-100%); }
        #toggle-btn { position: absolute; right: -45px; top: 20px; width: 45px; height: 45px; background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 0 8px 8px 0; font-size: 18px; z-index: 2001; }
        
        .product-tabs { display: flex; background: #051937; padding: 5px; gap: 4px; }
        .tab-btn { flex: 1; padding: 12px 2px; border: none; background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-weight: bold; font-size: 0.75rem; border-radius: 4px; }
        .tab-btn.active { background: var(--accent); color: white; }
        
        .header { background: var(--primary); color: white; padding: 20px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .created-by { font-size: 1.1rem; color: #FFD700; font-weight: 900; margin-bottom: 10px; display: block; text-shadow: 1px 1px 3px rgba(0,0,0,0.6); letter-spacing: 0.5px; }
        
        #prod-title { 
            margin: 0; font-size: 1.2rem; letter-spacing: -0.5px; cursor: pointer; display: inline-block; transition: 0.2s;
        }
        #prod-title:hover { color: #FFD700; transform: scale(1.02); }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; background: var(--accent); color: white; gap: 1px; border-top: 1px solid rgba(255,255,255,0.2); }
        .metric-box { padding: 10px; background: var(--accent); text-align: center; }
        .metric-label { font-size: 0.55rem; opacity: 0.9; display: block; margin-bottom: 2px; }
        .metric-value { font-size: 0.95rem; font-weight: bold; }

        #list-container { flex-grow: 1; overflow-y: auto; background: var(--bg); }
        .group-header { padding: 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.8rem; align-items: center; }
        .risk-header-current { background: var(--current); color: white; }
        .risk-header-future { background: #D35400; color: white; }
        .region-header { background: #cbdceb; color: var(--primary); margin-top: 2px; line-height: 1.3; }
        .country-header { background: #e8eff5; font-size: 0.7rem; padding-left: 20px; }
        
        .collapsible-content { display: none; }
        .open > .collapsible-content { display: block; }
        
        .plant-card { padding: 10px 12px 10px 30px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.72rem; background: white; position: relative; }
        .plant-card:hover { background: #f0f7ff; }
        .share-tag { font-size: 0.6rem; color: #1597BB; font-weight: bold; margin-left: 5px; }
        
        .loss-badge { background: #E74C3C; color: white; font-weight: bold; padding: 1px 6px; border-radius: 10px; font-size: 0.6rem; position: absolute; right: 10px; top: 10px; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; background: rgba(0,0,0,0.85); color: white; padding: 25px; border-radius: 15px; display: none; text-align: center; }

        .custom-triangle svg { filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3)); }
    </style>
</head>
<body>

<div id="loading">📡 데이터를 동기화 중입니다...<br><small style="color:#FFD700">Created by JS KIM of LAM</small></div>

<div id="layout">
    <div id="sidebar">
        <button id="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('hidden')">☰</button>
        <div class="product-tabs">
            <button class="tab-btn active" id="btn-SM" onclick="switchProduct('SM')">SM</button>
            <button class="tab-btn" id="btn-AN" onclick="switchProduct('AN')">AN</button>
            <button class="tab-btn" id="btn-BD" onclick="switchProduct('BD')">BD</button>
        </div>
        <div class="header">
            <span class="created-by">CREATED BY JS KIM OF LAM</span>
            <h1 id="prod-title" onclick="resetMap()" title="전체 지도로 리셋">Global Supply Control Map</h1>
        </div>
        
        <div class="metrics-grid">
            <div class="metric-box">
                <span class="metric-label">GLOBAL CAPA (K)</span>
                <span class="metric-value" id="global-val">0</span>
            </div>
            <div class="metric-box">
                <span class="metric-label">TOTAL SITES</span>
                <span class="metric-value" id="total-sites">0</span>
            </div>
            <div class="metric-box" style="background: #1A1A1B;">
                <span class="metric-label">CUR. LOSS RATIO</span>
                <span class="metric-value" id="cur-ratio" style="color:#E74C3C">0%</span>
            </div>
            <div class="metric-box" style="background: #D35400;">
                <span class="metric-label">FUT. LOSS RATIO</span>
                <span class="metric-value" id="fut-ratio" style="color:#F1C40F">0%</span>
            </div>
        </div>

        <div id="list-container">
            <div id="current-risk-group" class="open">
                <div class="group-header risk-header-current" onclick="this.parentElement.classList.toggle('open')"><span>⚠️ CURRENT RISK</span><span id="cur-sum-h" style="font-size:0.65rem;">0K Loss</span></div>
                <div class="collapsible-content" id="current-risk-list"></div>
            </div>
            <div id="future-risk-group" class="open">
                <div class="group-header risk-header-future" onclick="this.parentElement.classList.toggle('open')"><span>📅 FUTURE MAINT</span><span id="fut-sum-h" style="font-size:0.65rem;">0K Loss</span></div>
                <div class="collapsible-content" id="future-risk-list"></div>
            </div>
            <div style="background: var(--primary); color:white; padding:10px 12px; font-size:0.7rem; font-weight:bold; margin-top:10px; display:flex; justify-content:space-between;">
                <span>🌐 REGIONAL DIRECTORY</span>
                <span style="font-size:0.55rem; opacity:0.8;">Sorted by Plant Count</span>
            </div>
            <div id="region-list"></div>
        </div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const sheetURLs = {
        'SM': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=0&single=true&output=csv',
        'AN': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=263516767&single=true&output=csv',
        'BD': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDvfICYLfo93fAS6SmSmP5deJnM7fYm-N3uiruN0g_e9ZKrq-okIQ1wMlwnNEnq-XAdjJD8D9c-R85/pub?gid=607848019&single=true&output=csv'
    };

    const map = L.map('map', {zoomControl: false}).setView([20, 100], 3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let activeMarkers = [];

    function resetMap() { map.flyTo([20, 100], 3, { duration: 1.5 }); }

    const regionColors = {
        "NEA": "#5DADE2", "SEA": "#48C9B0", "NA": "#52BE80", "WE": "#AF7AC5", 
        "CE": "#9B59B6", "CIS": "#EB984E", "ME": "#EC7063", "AFRICA": "#A04000", 
        "SA": "#58D68D", "IND": "#F4D03F", "Other": "#BDC3C7"
    };

    function parseCSV(csv) {
        const lines = csv.split("\n").map(l => l.trim()).filter(l => l.length > 0);
        const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
        return lines.slice(1).map(line => {
            const values = line.split(",");
            let obj = {};
            headers.forEach((h, i) => {
                let val = values[i] ? values[i].trim() : "";
                if (["capacity", "lat", "lng", "days"].includes(h)) val = parseFloat(val.replace(/[^0-9.-]/g, "")) || 0;
                obj[h] = val;
            });
            return obj;
        });
    }

    async function switchProduct(prod) {
        document.getElementById('loading').style.display = 'block';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + prod).classList.add('active');
        try {
            const response = await fetch(sheetURLs[prod] + "&t=" + new Date().getTime());
            const csvText = await response.text();
            const data = parseCSV(csvText);
            document.getElementById('btn-' + prod).innerText = `${prod} (${data.length})`;
            renderEverything(data, prod);
        } catch (e) { console.error(e); alert("데이터 로드 실패."); }
        finally { document.getElementById('loading').style.display = 'none'; }
    }

    function createPlantIcon(p, isCur, isFut) {
        const baseSize = Math.sqrt(p.capacity) * 0.8;
        const color = isCur ? '#1A1A1B' : (isFut ? '#D35400' : null);
        if (isCur || isFut) {
            const iconSize = baseSize * 2.2;
            return L.divIcon({
                html: `<svg width="${iconSize}" height="${iconSize}" viewBox="0 0 24 24"><path d="M12 2L2 22H22L12 2Z" fill="${color}"/></svg>`,
                className: 'custom-triangle',
                iconSize: [iconSize, iconSize], iconAnchor: [iconSize / 2, iconSize / 2]
            });
        }
        return null;
    }

    function renderEverything(data, prodName) {
        activeMarkers.forEach(m => map.removeLayer(m));
        activeMarkers = [];
        document.getElementById('current-risk-list').innerHTML = '';
        document.getElementById('future-risk-list').innerHTML = '';
        document.getElementById('region-list').innerHTML = '';

        const globalTotalCapa = data.reduce((s, p) => s + p.capacity, 0);
        document.getElementById('global-val').innerText = Math.round(globalTotalCapa).toLocaleString();
        document.getElementById('total-sites').innerText = data.length;

        let curLoss = 0; let futLoss = 0;
        const regions = {};

        data.forEach(p => {
            const isCur = p.status && p.status.includes('Current');
            const isFut = p.status && p.status.includes('Future');
            const loss = ((p.capacity / 365) * (p.days || 0)).toFixed(1);
            const share = ((p.capacity / globalTotalCapa) * 100).toFixed(1);
            
            if(isCur) curLoss += parseFloat(loss);
            if(isFut) futLoss += parseFloat(loss);

            let marker;
            const icon = createPlantIcon(p, isCur, isFut);
            if (icon) marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(map);
            else {
                const regKey = Object.keys(regionColors).find(k => p.region && p.region.includes(k)) || "Other";
                marker = L.circleMarker([p.lat, p.lng], {
                    radius: Math.sqrt(p.capacity) * 0.8,
                    fillColor: regionColors[regKey], color: 'none', stroke: false, fillOpacity: 0.85
                }).addTo(map);
            }
            marker.bindPopup(`<b>${p.company}</b><br>${p.location}<br>Capa: ${p.capacity}K (${share}%)<br>Status: ${p.status}`);
            activeMarkers.push(marker);

            const createCard = (showShare = true) => {
                const card = document.createElement('div');
                card.className = `plant-card ${isCur?'current-risk':(isFut?'future-risk':'')}`;
                card.innerHTML = `${isCur||isFut ? '<span class="loss-badge">'+loss+'K Loss</span>' : ''}
                                  <b>${p.company}</b>${showShare ? '<span class="share-tag">('+share+'%)</span>' : ''}
                                  <div class="capa-info">${p.capacity}K MT | ${p.status}</div>`;
                card.onclick = () => { map.flyTo([p.lat, p.lng], 8); marker.openPopup(); };
                return card;
            };

            if(isCur) document.getElementById('current-risk-list').appendChild(createCard(false));
            else if(isFut) document.getElementById('future-risk-list').appendChild(createCard(false));

            const reg = p.region || "Unknown";
            const cou = p.country || "Other";
            if (!regions[reg]) regions[reg] = { name: reg, countries: {}, totalPlants: 0, totalCapa: 0 };
            if (!regions[reg].countries[cou]) regions[reg].countries[cou] = [];
            regions[reg].countries[cou].push(createCard(true));
            regions[reg].totalPlants++;
            regions[reg].totalCapa += p.capacity;
        });

        const curRatio = ((curLoss / globalTotalCapa) * 100).toFixed(2);
        const futRatio = ((futLoss / globalTotalCapa) * 100).toFixed(2);
        document.getElementById('cur-ratio').innerText = curRatio + "%";
        document.getElementById('fut-ratio').innerText = futRatio + "%";
        document.getElementById('cur-sum-h').innerText = curLoss.toFixed(1) + "K Loss";
        document.getElementById('fut-sum-h').innerText = futLoss.toFixed(1) + "K Loss";

        Object.values(regions).sort((a,b) => b.totalPlants - a.totalPlants).forEach(r => {
            const rShare = ((r.totalCapa / globalTotalCapa) * 100).toFixed(1);
            const rDiv = document.createElement('div');
            rDiv.innerHTML = `<div class="group-header region-header" onclick="this.parentElement.classList.toggle('open')">
                                <span>${r.name} (${r.totalPlants})<br>
                                <small style="font-weight:normal; font-size:0.6rem; opacity:0.8;">${Math.round(r.totalCapa).toLocaleString()}K (${rShare}%)</small></span>
                                <span>▾</span></div>`;
            const rCont = document.createElement('div'); rCont.className = 'collapsible-content';
            Object.keys(r.countries).sort().forEach(c => {
                const cDiv = document.createElement('div');
                cDiv.innerHTML = `<div class="group-header country-header" onclick="this.parentElement.classList.toggle('open')"><span>${c} (${r.countries[c].length})</span></div>`;
                const cCont = document.createElement('div'); cCont.className = 'collapsible-content';
                r.countries[c].forEach(card => cCont.appendChild(card));
                cDiv.appendChild(cCont); rCont.appendChild(cDiv);
            });
            rDiv.appendChild(rCont);
            document.getElementById('region-list').appendChild(rDiv);
        });
    }
    window.onload = () => switchProduct('SM');
</script>
</body>
</html>
