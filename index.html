<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Global Chemical Dashboard | SM·AN·BD Integrated Archive</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #0A2647; --accent: #1597BB; --current: #1A1A1B; --future: #F1C40F; --bg: #F0F5F9; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        #layout { display: flex; height: 100vh; width: 100vw; position: relative; }
        #map { flex-grow: 1; height: 100%; background: #DAEAF1; z-index: 1; }
        
        /* Sidebar */
        #sidebar { position: absolute; left: 0; top: 0; width: 320px; height: 100%; background: white; z-index: 2000; transition: transform 0.5s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        #sidebar.hidden { transform: translateX(-100%); }
        #toggle-btn { position: absolute; right: -45px; top: 20px; width: 45px; height: 45px; background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 0 8px 8px 0; font-size: 18px; z-index: 2001; }
        
        /* Product Selector */
        .product-tabs { display: flex; background: #051937; padding: 5px; gap: 5px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-weight: bold; font-size: 0.8rem; border-radius: 4px; transition: 0.3s; }
        .tab-btn.active { background: var(--accent); }
        
        .header { background: var(--primary); color: white; padding: 15px; cursor: pointer; }
        .global-cap { background: var(--accent); padding: 12px 15px; color: white; border-bottom: 2px solid rgba(0,0,0,0.1); cursor: pointer; }
        
        #list-container { flex-grow: 1; overflow-y: auto; background: var(--bg); }
        .group-header { padding: 10px 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.8rem; }
        .risk-header-current { background: var(--current); color: white; }
        .risk-header-future { background: var(--future); color: #333; }
        .region-header { background: #cbdceb; color: var(--primary); }
        .country-header { background: #eef2f5; color: #444; padding-left: 20px; font-size: 0.78rem; }
        
        .collapsible-content { display: none; }
        .open > .collapsible-content { display: block; }
        
        .plant-card { padding: 10px 12px 10px 30px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.72rem; background: white; position: relative; transition: 0.2s; }
        .plant-card:hover { background: #f0f7ff; }
        .plant-card.current-risk { border-left: 5px solid var(--current); }
        .plant-card.future-risk { border-left: 5px solid var(--future); }
        
        .badge { font-size: 0.6rem; padding: 2px 4px; border-radius: 3px; color: white; background: var(--accent); float: right; margin-left: 5px; }
        .badge.black { background: var(--current); }
        .badge.yellow { background: var(--future); color: #333; }
        .loss-badge { background: #E74C3C; color: white; font-weight: bold; padding: 1px 5px; border-radius: 10px; font-size: 0.6rem; position: absolute; right: 10px; top: 8px; }
        .share-badge { background: #555; color: white; padding: 1px 4px; border-radius: 4px; font-size: 0.55rem; position: absolute; right: 10px; bottom: 8px; }
        .capa-info { color: #666; font-size: 0.62rem; margin-top: 2px; }
    </style>
</head>

        if (!p.days) return 0;
        return ((p.capacity / 365) * p.days).toFixed(1);
    }

        const bCol = isCurrent ? 'black' : (isFuture ? 'yellow' : '');
        const lossBadge = (isCurrent || isFuture) ? `<span class="loss-badge">${loss}K Loss</span>` : '';
        const shareBadge = (isCurrent || isFuture) ? `<span class="share-badge">${share}% Share</span>` : '';
        
        card.innerHTML = `${lossBadge}${shareBadge}<span class="badge ${bCol}">${p.status.split('(')[0]}</span><b>${p.company}</b><div class="capa-info">${p.capacity}K MT | ${p.days || 0} Days Stop</div>`;
        card.onclick = (e) => { e.stopPropagation(); flyWithOffset([p.lat, p.lng], 9); setTimeout(() => p._m.openPopup(), 1800); };
        return card;
    }

    function updateDashboard() {
        // Clear previous
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        document.getElementById('current-risk-list').innerHTML = '';
        document.getElementById('future-risk-list').innerHTML = '';
        document.getElementById('region-list').innerHTML = '';

        const data = allProducts[currentProd];
        const globalTotal = data.reduce((s, p) => s + p.capacity, 0);
        document.getElementById('global-val').innerText = globalTotal.toLocaleString();

        const currentRisks = data.filter(p => p.status.includes('Current'));
        const futureRisks = data.filter(p => p.status.includes('Future'));

        const curLossSum = currentRisks.reduce((s, p) => s + parseFloat(calculateLoss(p)), 0).toFixed(1);
        const futLossSum = futureRisks.reduce((s, p) => s + parseFloat(calculateLoss(p)), 0).toFixed(1);
        
        document.getElementById('current-total-header').innerText = `${parseFloat(curLossSum).toLocaleString()}K (${((curLossSum/globalTotal)*100).toFixed(1)}% Loss) ▼`;
        document.getElementById('future-total-header').innerText = `${parseFloat(futLossSum).toLocaleString()}K (${((futLossSum/globalTotal)*100).toFixed(1)}% Loss) ▼`;

        const nested = {};
        data.forEach(p => {
            const isRisk = p.status.includes('Current') || p.status.includes('Future');
            const m = L.circleMarker([p.lat, p.lng], { 
                radius: Math.sqrt(p.capacity) * 0.65, 
                fillColor: regionColors[p.region] || '#333', 
                color: p.status.includes('Current') ? '#000' : (p.status.includes('Future') ? '#F1C40F' : '#fff'),
                weight: isRisk ? 5 : 1.5, fillOpacity: 0.85 
            }).addTo(map);

            const lossVal = calculateLoss(p);
            const share = ((p.capacity / globalTotal) * 100).toFixed(2);
            let pop = `<b>${p.company}</b><br>${p.location}<br>Annual Capa: ${p.capacity}K (${share}% Share)<br>Status: <b>${p.status}</b>`;
            if(p.days) pop += `<br><span style="color:red; font-weight:bold;">Loss in Period: ${lossVal}K MT</span><br><small>Period: ${p.period}</small>`;
            m.bindPopup(pop); p._m = m;
            markers.push(m);

            if (!nested[p.region]) nested[p.region] = { capa: 0, countries: {} };
            if (!nested[p.region].countries[p.country]) nested[p.region].countries[p.country] = { capa: 0, plants: [] };
            nested[p.region].capa += p.capacity;
            nested[p.region].countries[p.country].capa += p.capacity;
            nested[p.region].countries[p.country].plants.push(p);
        });

        // Populate Lists
        currentRisks.sort((a,b)=>b.capacity-a.capacity).forEach(p=>document.getElementById('current-risk-list').appendChild(createCard(p, globalTotal)));
        futureRisks.sort((a,b)=>b.capacity-a.capacity).forEach(p=>document.getElementById('future-risk-list').appendChild(createCard(p, globalTotal)));

        Object.entries(nested).sort((a,b)=>b[1].capa - a[1].capa).forEach(([rName, rData]) => {
            const rDiv = document.createElement('div');
            rDiv.className = 'region-group';
            rDiv.innerHTML = `<div class="group-header region-header" onclick="flyWithOffset(regionFlyTo['${rName}'].c, regionFlyTo['${rName}'].z); this.parentElement.classList.toggle('open')"><span>${rName} (${((rData.capa/globalTotal)*100).toFixed(1)}%)</span><span>▼</span></div><div class="collapsible-content"></div>`;
            const countryList = rDiv.querySelector('.collapsible-content');
            Object.entries(rData.countries).sort((a,b)=>b[1].capa-a[1].capa).forEach(([cName, cData]) => {
                const cDiv = document.createElement('div');
                cDiv.innerHTML = `<div class="group-header country-header" onclick="this.parentElement.classList.toggle('open')"><span>${cName} (${((cData.capa/globalTotal)*100).toFixed(1)}%)</span><span>▼</span></div><div class="collapsible-content"></div>`;
                const pList = cDiv.querySelector('.collapsible-content');
                cData.plants.forEach(p => pList.appendChild(createCard(p, globalTotal)));
                countryList.appendChild(cDiv);
            });
            document.getElementById('region-list').appendChild(rDiv);
        });
    }

    // Initial Load
    // (이곳에 AN, BD 데이터를 allProducts 객체에 추가한 후 호출)
    updateDashboard();
</script>
</body>
</html>
