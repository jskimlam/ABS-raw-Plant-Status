<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SM World Map v12.1</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; background: #f0f2f5; }
        .risk-icon { filter: drop-shadow(0 0 3px rgba(0,0,0,0.5)); }
        .leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: 0 3px 14px rgba(0,0,0,0.2); }
        .popup-title { font-weight: bold; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 8px; color: #2C3E50; }
        .popup-info { font-size: 12px; line-height: 1.6; }
        .history-box { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ccc; max-height: 100px; overflow-y: auto; font-size: 11px; color: #555; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // 1. 지도 초기화 (전 세계 보기)
        const map = L.map('map').setView([20, 10], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let activeMarkers = [];

        // 2. 이번 달 가동 중단 일수 계산 함수
        function getMonthIntersectionDays(startStr, endStr) {
            if (!startStr || !endStr) return 0;
            const start = new Date(startStr);
            const end = new Date(endStr);
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);

            const intersectStart = new Date(Math.max(start, firstDay));
            const intersectEnd = new Date(Math.min(end, lastDay));

            if (intersectStart <= intersectEnd) {
                return Math.floor((intersectEnd - intersectStart) / (1000 * 60 * 60 * 24)) + 1;
            }
            return 0;
        }

        // 3. 데이터 렌더링 함수
        function renderEverything(data) {
            // 기존 마커 제거
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];

            // Deleted 업체 필터링
            const activeData = data.filter(p => !(p.status && p.status.toLowerCase().includes('deleted')));

            activeData.forEach(p => {
                if(!p.lat || !p.lng) return;

                const capa = parseFloat(p.capacity) || 0;
                // 사장님이 바꾸신 Start_Date, End_Date 컬럼 사용
                const intersectDays = getMonthIntersectionDays(p.start_date, p.end_date);
                const monthlyLoss = (capa / 365) * intersectDays;

                const size = Math.sqrt(capa) * 0.55;
                const status = p.status || 'Normal';
                const isRisk = status.includes('Shutdown') || status.includes('Maintenance');

                // 마커 생성 (리스크가 있으면 삼각형, 정상이면 원형)
                let marker;
                if (isRisk) {
                    const triangleIcon = L.divIcon({
                        className: 'risk-icon',
                        html: `<svg width="${size*2}" height="${size*2}" viewBox="0 0 24 24"><path d="M12 2L2 22H22L12 2Z" fill="#1A1A1B" stroke="white" stroke-width="2"/></svg>`,
                        iconSize: [size * 2, size * 2],
                        iconAnchor: [size, size]
                    });
                    marker = L.marker([p.lat, p.lng], { icon: triangleIcon }).addTo(map);
                } else {
                    marker = L.circleMarker([p.lat, p.lng], {
                        radius: size,
                        fillColor: '#5DADE2',
                        fillOpacity: 0.8,
                        color: 'white',
                        weight: 1
                    }).addTo(map);
                }

                // 팝업 내용 (사장님이 바꾸신 Summary 컬럼 반영)
                const popupContent = `
                    <div class="popup-info">
                        <div class="popup-title">${p.company}</div>
                        <b>Status:</b> <span style="color:${isRisk ? '#E74C3C' : '#27AE60'};">${status}</span><br>
                        <b>Capacity:</b> ${capa}K MT<br>
                        <b>Month Loss:</b> <span style="font-weight:bold; color:#E74C3C;">${monthlyLoss.toFixed(1)}K MT</span>
                        <div class="history-box">
                            <b>HISTORY SUMMARY:</b><br>
                            ${p.summary || 'No recent updates'}
                        </div>
                    </div>
                `;
                marker.bindPopup(popupContent);
                activeMarkers.push(marker);
            });
        }

        // 4. 앱시트 데이터 수신 대기
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (Array.isArray(data)) {
                renderEverything(data);
            }
        });
    </script>
</body>
</html>
