<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Global Supply Control Tower | JS KIM (v12.5)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        /* [v11.2 디자인 & 보안 모달 스타일 100% 복구] */
        :root { --primary: #0A2647; --accent: #1597BB; --current: #1A1A1B; --future: #D35400; --bg: #F0F5F9; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        #layout { display: flex; height: 100vh; width: 100vw; position: relative; }
        #map { flex-grow: 1; height: 100%; background: #0b192e; z-index: 1; }
        #sidebar { position: absolute; left: 0; top: 0; width: 360px; height: 100%; background: white; z-index: 2000; transition: transform 0.4s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        #sidebar.hidden { transform: translateX(-100%); }
        #toggle-btn { position: absolute; right: -45px; top: 20px; width: 45px; height: 45px; background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 0 8px 8px 0; font-size: 18px; z-index: 2001; }
        .header { background: var(--primary); color: white; padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); position: relative; }
        .created-by { font-size: 1.3rem; color: #FFD700; font-weight: 900; display: block; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 15px; border-bottom: 1px solid rgba(255,215,0,0.3); padding-bottom: 5px; }
        #data-mode { position: absolute; right: 20px; bottom: 20px; font-size: 0.65rem; font-weight: 900; padding: 4px 10px; border-radius: 12px; background: #95a5a6; color: white; cursor: pointer; z-index: 2002; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; background: var(--accent); color: white; gap: 1px; }
        .metric-box { padding: 12px; background: var(--accent); text-align: center; }
        .metric-value { font-size: 1.25rem; font-weight: 900; }
        #list-container { flex-grow: 1; overflow-y: auto; background: var(--bg); }
        .group-header { padding: 14px 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .plant-card { padding: 12px 15px 12px 30px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.72rem; background: white; position: relative; }
        .loss-badge { background: #E74C3C; color: white; font-weight: bold; padding: 2px 6px; border-radius: 10px; font-size: 0.6rem; position: absolute; right: 10px; top: 10px; }
        /* [보안 모달 스타일] */
        #update-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; background: white; z-index: 11000; padding: 25px; box-shadow: 0 0 60px rgba(0,0,0,0.6); border-radius: 20px; display: none; }
        #admin-password { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid var(--primary); border-radius: 8px; box-sizing: border-box; text-align: center; }
        #data-input-section { display: none; border-top: 2px dashed #eee; padding-top: 15px; }
        textarea { width: 100%; height: 180px; font-size: 0.75rem; border: 1px solid #ddd; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="update-modal">
    <div id="auth-section">
        <h3 style="margin-top:0; color:var(--primary);">🔒 JS KIM Security</h3>
        <input type="password" id="admin-password" placeholder="Admin Password">
        <button style="background:var(--primary); color:white; padding:12px; width:100%; border:none; border-radius:8px; cursor:pointer; font-weight:900;" onclick="verifyAdmin()">인증</button>
    </div>
    <div id="data-input-section">
        <textarea id="csv-input" placeholder="업체명,Capacity,Lat,Lng... 데이터를 붙여넣으세요"></textarea>
        <button style="width:100%; background:#27ae60; color:white; padding:15px; border:none; border-radius:10px; cursor:pointer; font-weight:900;" onclick="saveManualData()">메모리 저장</button>
    </div>
    <button style="width:100%; margin-top:15px; border:none; padding:10px; cursor:pointer;" onclick="closeModal()">닫기</button>
</div>

<div id="layout">
    <div id="sidebar">
        <button id="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('hidden')">☰</button>
        <div class="header">
            <span class="created-by">CREATED BY JS KIM OF LAM</span>
            <h1 style="margin:0; font-size:1.1rem;">Global Supply Control Map</h1>
            <span id="data-mode" onclick="showUpdateModal()">SYNC CHECK</span>
        </div>
        <div class="metrics-grid">
            <div class="metric-box"><span>GLOBAL CAPA</span><span class="metric-value" id="global-val">0</span></div>
            <div class="metric-box"><span>TOTAL SITES</span><span class="metric-value" id="total-sites">0</span></div>
            <div class="metric-box" style="background: #1A1A1B;"><span>MONTH LOSS</span><span class="metric-value" id="cur-loss-mt" style="color:#FFD700">0K</span></div>
            <div class="metric-box" style="background: #1A1A1B;"><span>LOSS RATIO</span><span class="metric-value" id="cur-ratio" style="color:#FF4D4D">0.00%</span></div>
        </div>
        <div id="list-container">
            <div id="current-risk-group" class="open">
                <div class="group-header" style="background:var(--current); color:white" onclick="this.parentElement.classList.toggle('open')"><span>⚠️ CURRENT RISK</span><span id="cur-sum-h"></span></div>
                <div class="collapsible-content" id="current-risk-list"></div>
            </div>
            <div id="region-list"></div>
        </div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const ADMIN_PASS = "jskim0111"; //
    const map = L.map('map', {zoomControl: false}).setView([20, 100], 3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
    let activeMarkers = [], currentRawData = [];

    // [보안 기능]
    function showUpdateModal() { document.getElementById('update-modal').style.display = 'block'; }
    function closeModal() { document.getElementById('update-modal').style.display = 'none'; }
    function verifyAdmin() { if (document.getElementById('admin-password').value === ADMIN_PASS) { document.getElementById('auth-section').style.display = 'none'; document.getElementById('data-input-section').style.display = 'block'; } else { alert("암호 불일치."); } }
    
    // [수동 데이터 저장]
    function saveManualData() {
        const input = document.getElementById('csv-input').value;
        const lines = input.split('\n').filter(l => l.trim().length > 0);
        const heads = lines[0].split(',').map(h => h.trim().toLowerCase());
        const data = lines.slice(1).map(line => {
            const vals = line.split(','); let obj = {};
            heads.forEach((h, i) => { obj[h] = vals[i] ? vals[i].trim() : ""; });
            return obj;
        });
        localStorage.setItem('MANUAL_SM_DATA', JSON.stringify(data));
        alert("메모리에 수동 데이터가 저장되었습니다.");
        renderEverything(data);
        closeModal();
    }

    // [날짜 계산 로직]
    function getMonthIntersectionDays(startStr, endStr) {
        if (!startStr || !endStr) return 0;
        const now = new Date();
        const mStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const mEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        const pStart = new Date(startStr);
        const pEnd = new Date(endStr);
        const iStart = new Date(Math.max(mStart, pStart));
        const iEnd = new Date(Math.min(mEnd, pEnd));
        return (iStart > iEnd) ? 0 : Math.floor((iEnd - iStart) / 86400000) + 1;
    }

    // [앱시트 데이터 수신 - 자동 연동]
    window.addEventListener('message', function(event) {
        if (Array.isArray(event.data)) {
            document.getElementById('data-mode').innerText = "LIVE SYNC";
            document.getElementById('data-mode').style.background = "#2ECC71";
            renderEverything(event.data);
        }
    });

    function renderEverything(data) {
        activeMarkers.forEach(m => map.removeLayer(m)); activeMarkers = [];
        document.getElementById('current-risk-list').innerHTML = '';
        document.getElementById('region-list').innerHTML = '';

        let totalCapa = 0, totalLoss = 0;
        const activeData = data.filter(p => !(p.status && p.status.toLowerCase().includes('deleted')));

        activeData.forEach(p => {
            const capa = parseFloat(p.capacity) || 0;
            // 사장님의 새로운 날짜 컬럼 반영
            const lossDays = getMonthIntersectionDays(p.start_date, p.end_date);
            const loss = (capa / 365) * lossDays;
            totalCapa += capa; totalLoss += loss;

            if(!p.lat || !p.lng) return;
            const size = Math.sqrt(capa) * 0.55;
            const isRisk = p.status.includes('Shutdown') || p.status.includes('Maintenance');

            const m = isRisk ? 
                L.marker([p.lat, p.lng], { icon: L.divIcon({ html: `<svg width="${size*2.2}" height="${size*2.2}" viewBox="0 0 24 24"><path d="M12 2L2 22H22L12 2Z" fill="#1A1A1B" stroke="white" stroke-width="2"/></svg>`, className: 'custom-triangle' }) }).addTo(map) :
                L.circleMarker([p.lat, p.lng], { radius: size, fillColor: '#5DADE2', fillOpacity: 0.9 }).addTo(map);

            // 새로운 요약 컬럼 반영
            m.bindPopup(`<b>${p.company}</b><br><span style="color:#E74C3C; font-weight:900;">${p.status}</span><br>Loss: ${loss.toFixed(1)}K MT<div style="margin-top:10px; border-top:1px dashed #ccc; padding-top:5px;"><b>SUMMARY</b><br>${p.summary || '기록 없음'}</div>`);
            activeMarkers.push(m);

            if(isRisk) {
                const card = document.createElement('div');
                card.className = 'plant-card';
                card.innerHTML = `<span class="loss-badge">${loss.toFixed(1)}K</span><b>${p.company}</b><div style="color:#666; font-size:0.65rem;">${capa}K | ${p.status}</div>`;
                card.onclick = () => { map.flyTo([p.lat, p.lng], 7); m.openPopup(); };
                document.getElementById('current-risk-list').appendChild(card);
            }
        });

        document.getElementById('global-val').innerText = Math.round(totalCapa).toLocaleString();
        document.getElementById('total-sites').innerText = activeData.length;
        document.getElementById('cur-loss-mt').innerText = totalLoss.toFixed(1) + "K";
        document.getElementById('cur-ratio').innerText = totalCapa > 0 ? ((totalLoss / (totalCapa/12)) * 100).toFixed(2) + "%" : "0.00%";
        document.getElementById('cur-sum-h').innerText = totalLoss.toFixed(1) + "K ▼";
    }

    // 초기 로딩 시 메모리에 데이터가 있으면 불러오기
    window.onload = () => {
        const memData = localStorage.getItem('MANUAL_SM_DATA');
        if (memData) {
            document.getElementById('data-mode').innerText = "MEMORY MODE";
            document.getElementById('data-mode').style.background = "#E74C3C";
            renderEverything(JSON.parse(memData));
        }
    };
</script>
</body>
</html>
